name: Android Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android Lint
        run: gradle lintDebug

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tiktok-region-spoof-apk
          path: app/build/outputs/apk/debug/dev.magisk.tiktokregionspoof-universal-*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: app/build/outputs/apk/debug/dev.magisk.tiktokregionspoof-universal-*.apk
